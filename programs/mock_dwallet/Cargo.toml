[package]
name = "mock_dwallet"
version = "0.1.0"
description = "Local stand-in for the Ika dWallet program (transfer_ownership + approve_message subset)"
edition.workspace = true
license = "BSD-3-Clause-Clear"
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "mock_dwallet"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.0"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
